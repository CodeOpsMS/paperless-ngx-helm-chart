{{- if and
  .Values.persistence.enabled
  (not .Values.persistence.hostPath)
  (not .Values.persistence.existingClaim)
}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ template "paperless-ngx.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  {{- if or .Values.persistence.retain .Values.persistence.annotations }}
  annotations:
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.persistence.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  {{-  if (eq "-" .) }}
  storageClassName: ""
  {{-  else }}
  storageClassName: {{ . | quote }}
  {{-  end }}
  {{- end }}
{{- end -}}
