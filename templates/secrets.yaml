---
{{- include "paperless-ngx.validateDependencies" . }}
{{- $fullname := include "paperless-ngx.fullname" . }}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace $fullname) }}
{{- $valkeyPort := int .Values.valkey.service.port }}
{{- $database := .Values.config.database }}
{{- if ne $valkeyPort 6379 }}
{{- fail "valkey.service.port must be 6379 because the bundled Valkey chart configures its server on that fixed port" }}
{{- end }}
{{- if and .Values.postgresql.enabled (or (ne $database.engine "postgresql") $database.host $database.existingSecret.name (ne $database.name "paperless") (ne $database.user "paperless") $database.password $database.port) }}
{{- fail "config.database engine/host/name/user/password/port/existingSecret are for external databases; when postgresql.enabled=true keep their internal defaults and configure the bundled database only through postgresql.auth" }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (ne $database.engine "sqlite") (eq (empty $database.password) (empty $database.existingSecret.name)) }}
{{- fail "an external database requires exactly one password source: config.database.password or config.database.existingSecret.name" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}

data:
  {{- with .Values.config.url }}
  PAPERLESS_URL: {{ . | toString | b64enc }}
  {{- else }}
  {{- $ingressTLS := ne ( len .Values.ingress.tls ) 0 }}
  PAPERLESS_URL: {{ printf "%s://%s" (ternary "https" "http" $ingressTLS) (first .Values.ingress.hosts).host | b64enc }}
  {{- end }}
  {{- if .Values.valkey.internal }}
  PAPERLESS_REDIS: {{ printf "redis://%s:%d/%d" (include "paperless-ngx.valkeyFullname" $) $valkeyPort (int .Values.valkey.dbid) | b64enc }}
  {{- else if not .Values.config.redis.existingSecret.name }}
  {{- with .Values.config.redis.url }}
  PAPERLESS_REDIS: {{ . | toString | b64enc }}
  {{- end }}
  {{- end }}
  {{- with .Values.config.redis.prefix }}
  PAPERLESS_REDIS_PREFIX: {{ . | toString | b64enc }}
  {{- end }}

  {{- with .Values.config.database }}
  {{- with .engine }}
  PAPERLESS_DBENGINE: {{ . | toString | b64enc }}
  {{- end }}
  {{- if $.Values.postgresql.enabled }}
  PAPERLESS_DBHOST: {{ include "paperless-ngx.postgresqlFullname" $ | b64enc }}
  {{- $postgresqlPort := include "paperless-ngx.postgresqlServicePort" $ | int }}
  {{- if ne $postgresqlPort 5432 }}
  PAPERLESS_DBPORT: {{ $postgresqlPort | toString | b64enc }}
  {{- end }}
  PAPERLESS_DBNAME: {{ include "paperless-ngx.postgresqlDatabase" $ | b64enc }}
  PAPERLESS_DBUSER: {{ include "paperless-ngx.postgresqlUsername" $ | b64enc }}
  {{- else if ne .engine "sqlite" }}
  {{- with .host }}
  PAPERLESS_DBHOST: {{ . | toString | b64enc }}
  {{- end }}
  {{- with .port }}
  PAPERLESS_DBPORT: {{ . | toString | b64enc }}
  {{- end }}
  {{- with .name }}
  PAPERLESS_DBNAME: {{ . | toString | b64enc }}
  {{- end }}
  {{- with .user }}
  PAPERLESS_DBUSER: {{ . | toString | b64enc }}
  {{- end }}
  {{- if and (not .existingSecret.name) .password }}
  PAPERLESS_DBPASS: {{ .password | toString | b64enc }}
  {{- end }}
  {{- end }}{{/* end-if external non-SQLite database */}}
  {{- with .options }}
  PAPERLESS_DB_OPTIONS: {{ . | toString | b64enc }}
  {{- end }}
  {{- end }}{{/* end-with .config.database */}}

  {{- with .Values.config.apps }}
  PAPERLESS_APPS: {{ . | toString | b64enc }}
  {{- end }}
  {{- with .Values.config.oidcProviders }}
  PAPERLESS_SOCIALACCOUNT_PROVIDERS: {{ toJson . | b64enc }}
  {{- end }}

  {{- if not .Values.config.secretKey.existingSecret.name }}
  PAPERLESS_SECRET_KEY: {{ dig "data" "PAPERLESS_SECRET_KEY" "" $secret
    | b64dec
    | default (randAlphaNum 64)
    | b64enc }}
  {{- end }}

  {{- range $name, $value := .Values.env }}
  {{- if not (kindIs "map" $value) }}
  {{ $name }}: {{ toString $value | b64enc }}
  {{- end }}
  {{- end }}
