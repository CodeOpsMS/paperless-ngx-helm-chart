---
{{- $fullname := include "paperless-ngx.fullname" . }}
{{- $hasStructuredEnv := or .Values.config.secretKey.existingSecret.name .Values.config.database.existingSecret.name (and (not .Values.valkey.internal) .Values.config.redis.existingSecret.name) -}}
{{- range $value := .Values.env -}}
{{- if kindIs "map" $value -}}
{{- $hasStructuredEnv = true -}}
{{- end -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
    {{- with .Values.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "paperless-ngx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        "checksum/config": {{ toYaml .Values.config | sha256sum }}
        "checksum/env": {{ toYaml .Values.env | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "paperless-ngx.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "paperless-ngx.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "paperless-ngx.image" . | quote }}
          imagePullPolicy: {{ coalesce .Values.global.image.pullPolicy .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            {{- if .Values.env.PAPERLESS_ENABLE_FLOWER }}
            - name: metrics
              containerPort: 5555
              protocol: TCP
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}
          {{- if $hasStructuredEnv }}
          env:
            {{- if .Values.config.secretKey.existingSecret.name }}
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretKey.existingSecret.name | quote }}
                  key: {{ .Values.config.secretKey.existingSecret.key | quote }}
            {{- end }}
            {{- if .Values.config.database.existingSecret.name }}
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.database.existingSecret.name | quote }}
                  key: {{ .Values.config.database.existingSecret.passwordKey | quote }}
            {{- end }}
            {{- if and (not .Values.valkey.internal) .Values.config.redis.existingSecret.name }}
            - name: PAPERLESS_REDIS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.redis.existingSecret.name | quote }}
                  key: {{ .Values.config.redis.existingSecret.urlKey | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            {{- if (kindIs "map" $value) }}
            - name: {{ $name | quote }}
              {{- toYaml $value | nindent 14 }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /usr/src/paperless/data
              name: storage
              subPath: data
            - mountPath: /usr/src/paperless/media
              name: storage
              subPath: media
            - mountPath: /usr/src/paperless/consume
              name: storage
              subPath: consume
            - mountPath: /usr/src/paperless/export
              name: storage
              subPath: export
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: storage
          {{- with .Values.persistence }}
          {{- with .hostPath }}
          hostPath:
            type: Directory
            path: {{ . | quote }}
          {{- else }}
          {{- if .enabled }}
          persistentVolumeClaim:
            claimName: {{ coalesce .existingClaim $fullname }}
          {{- else }}
          emptyDir: {}
          {{- end }}{{/* end-if persistence.enabled */}}
          {{- end }}{{/* end-else-with hostPath */}}
          {{- end }}{{/* end-with persistence */}}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
