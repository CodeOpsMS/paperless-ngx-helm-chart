{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) }}
{{- fail "autoscaling.maxReplicas must be greater than or equal to autoscaling.minReplicas" }}
{{- end }}
{{- $cpuTarget := .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- $memoryTarget := .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- $resources := default (dict) .Values.resources }}
{{- $requests := default (dict) (get $resources "requests") }}
{{- if and .Values.autoscaling.enabled (or $cpuTarget (and (empty $cpuTarget) (empty $memoryTarget))) (empty (get $requests "cpu")) }}
{{- fail "resources.requests.cpu is required when HPA uses the CPU utilization metric" }}
{{- end }}
{{- if and .Values.autoscaling.enabled $memoryTarget (empty (get $requests "memory")) }}
{{- fail "resources.requests.memory is required when HPA uses the memory utilization metric" }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "paperless-ngx.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "paperless-ngx.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- if or $cpuTarget $memoryTarget }}
  metrics:
    {{- if $cpuTarget }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cpuTarget }}
    {{- end }}
    {{- if $memoryTarget }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $memoryTarget }}
    {{- end }}
  {{- end }}
{{- end }}
