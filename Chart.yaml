apiVersion: v2
name: paperless-ngx
description: >-
  A community Helm chart for Paperless-ngx, a document management system
  that transforms physical documents into a searchable online archive.
type: application
kubeVersion: ">=1.34.0-0"
icon: https://raw.githubusercontent.com/paperless-ngx/paperless-ngx/main/docs/assets/logo_leaf.svg
home: https://github.com/CodeOpsMS/paperless-ngx-helm-chart
version: "0.4.0-experimental.2"
# renovate: image=ghcr.io/paperless-ngx/paperless-ngx
appVersion: "3.1.2"
keywords:
  - paperless
  - paperless-ng
  - paperless-ngx
  - dms
  - document
maintainers:
  - name: CodeOpsMS
    email: codeopsms@users.noreply.github.com
    url: https://github.com/CodeOpsMS
sources:
  - https://github.com/CodeOpsMS/paperless-ngx-helm-chart
  - https://github.com/paperless-ngx/paperless-ngx
  - https://codeberg.org/wrenix/helm-charts/src/branch/main/paperless-ngx
annotations:
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: Publish Paperless-ngx 3 as an explicitly experimental chart alongside stable chart 0.3.23
    - kind: changed
      description: Upgrade Paperless-ngx from 2.20.15 to 3.1.2
    - kind: added
      description: Add strict values validation, immutable image pins, and Paperless 3 upgrade guidance
    - kind: fixed
      description: Use a stable upstream icon URL and migration-safe startup probes
    - kind: fixed
      description: Replace Secret-derived pod annotation hashes with an explicit non-sensitive rollout revision
    - kind: fixed
      description: Refresh the immutable Valkey 9.0.5 manifest digest after the upstream tag was republished
    - kind: fixed
      description: Restore supported dependency registry and OpenShift global options under strict values validation
    - kind: fixed
      description: Reject PAPERLESS_SEARCH_LANGUAGE while its explicit use prevents Paperless 3.1.2 from starting
    - kind: changed
      description: Use and validate a zero-surge RollingUpdate strategy compatible with Helm 4 server-side apply; the documented complete scale-to-zero procedure remains the major-version migration guard
    - kind: fixed
      description: Restore Secret-backed PAPERLESS_SOCIALACCOUNT_PROVIDERS without exposing OIDC credentials in values
  artifacthub.io/images: |
    - name: Paperless-ngx
      image: ghcr.io/paperless-ngx/paperless-ngx@sha256:5ab4f4f9bb099a36bec3e092906ea3e611323c5f18dc5cc38c76a1d540bdca9c
    - name: PostgreSQL
      image: docker.io/bitnamilegacy/postgresql@sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d
    - name: Valkey
      image: docker.io/valkey/valkey:9.0.5@sha256:2437dbc85bb67005fa7db135dfbc45075b800f4afa1ab2a301e3b878b0c273e2
    - name: Helm test
      image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/CodeOpsMS/paperless-ngx-helm-chart
    - name: Paperless-ngx project
      url: https://github.com/paperless-ngx/paperless-ngx
    - name: Forked from WrenIX
      url: https://codeberg.org/wrenix/helm-charts/src/branch/main/paperless-ngx
dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: "oci://docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: valkey
    version: "0.9.4"
    repository: "https://valkey.io/valkey-helm/"
    condition: valkey.internal
