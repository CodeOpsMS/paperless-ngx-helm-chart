apiVersion: v2
name: paperless-ngx
description: >-
  A community Helm chart for Paperless-ngx, a document management system
  that transforms physical documents into a searchable online archive.
type: application
kubeVersion: ">=1.34.0-0"
icon: https://raw.githubusercontent.com/paperless-ngx/paperless-ngx/main/docs/assets/logo_leaf.svg
home: https://github.com/CodeOpsMS/paperless-ngx-helm-chart
version: "0.4.0"
# renovate: image=ghcr.io/paperless-ngx/paperless-ngx
appVersion: "3.1.3"
keywords:
  - paperless
  - paperless-ng
  - paperless-ngx
  - dms
  - document
maintainers:
  - name: CodeOpsMS
    email: codeopsms@users.noreply.github.com
    url: https://github.com/CodeOpsMS
sources:
  - https://github.com/CodeOpsMS/paperless-ngx-helm-chart
  - https://github.com/paperless-ngx/paperless-ngx
  - https://codeberg.org/wrenix/helm-charts/src/branch/main/paperless-ngx
annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: added
      description: Gate publication on GitHub-hosted Kubernetes acceptance of the exact candidate and source commit; keep external rehearsals optional
    - kind: added
      description: Test broker priority queues and worker state, actual Prometheus scraping and enforced metrics NetworkPolicy
    - kind: changed
      description: Promote the validated Paperless-ngx 3.1.3 chart to stable 0.4.0; retain 0.3.23 as the explicitly pinned Paperless 2 baseline
    - kind: changed
      description: Upgrade Paperless-ngx from 3.0.5 to 3.1.3 including the 3.1.2 security fix GHSA-2jhj-xqrq-rmrq and 3.1.3 hardening
    - kind: added
      description: Test upgrades from both stable 0.3.23 and published 0.4.0-experimental.1
    - kind: fixed
      description: Restore explicit PAPERLESS_SEARCH_LANGUAGE after the upstream 3.1.0 startup fix
    - kind: fixed
      description: Render valid Prometheus alert groups and disable Flower consistently when configured false
    - kind: fixed
      description: Refresh the immutable Valkey 9.0.5 manifest digest after the upstream tag was republished
    - kind: fixed
      description: Preserve reviewed update branches and historical migration notes in release automation
    - kind: fixed
      description: Validate remote OCR mode and require enabled Flower for a ServiceMonitor
    - kind: changed
      description: Update migration guidance for fixed 3.0 issues, Python 3.14, remote OCR, and remaining legacy database limitations
  artifacthub.io/images: |
    - name: Paperless-ngx
      image: ghcr.io/paperless-ngx/paperless-ngx@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
    - name: PostgreSQL
      image: docker.io/bitnamilegacy/postgresql@sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d
    - name: Valkey
      image: docker.io/valkey/valkey:9.0.5@sha256:4c64dfeae602349cd38b70ecfc631ab99624283cd975f34f96a72c6050f1b890
    - name: Helm test
      image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/CodeOpsMS/paperless-ngx-helm-chart
    - name: Paperless-ngx project
      url: https://github.com/paperless-ngx/paperless-ngx
    - name: Forked from WrenIX
      url: https://codeberg.org/wrenix/helm-charts/src/branch/main/paperless-ngx
dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: "oci://docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: valkey
    version: "0.9.4"
    repository: "https://valkey.io/valkey-helm/"
    condition: valkey.internal
