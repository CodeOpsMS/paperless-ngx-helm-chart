name: Auto-Update Paperless-ngx

on:
  schedule:
    # Check the latest stable upstream release every six hours.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: auto-update-paperless
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for a new stable Paperless-ngx release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          current_version=$(awk '/^appVersion:/ { gsub(/"/, "", $2); print $2 }' Chart.yaml)
          if ! [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid current appVersion: ${current_version}"
            exit 1
          fi

          current_digest=$(awk '
            /^image:/ { in_image=1; next }
            in_image && /^  digest:/ { gsub(/"/, "", $2); print $2; exit }
            in_image && /^[^ ]/ { exit }
          ' values.yaml)
          if ! [[ "$current_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid current Paperless-ngx image digest: ${current_digest:-missing}"
            exit 1
          fi

          release_json=$(curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/paperless-ngx/paperless-ngx/releases/latest)
          latest_tag=$(jq -r '.tag_name // empty' <<<"$release_json")
          latest_version=${latest_tag#v}

          if ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GitHub returned an invalid stable release tag: ${latest_tag:-missing}"
            exit 1
          fi

          echo "Current Paperless-ngx version: ${current_version}"
          echo "Latest stable Paperless-ngx version: ${latest_version}"

          newest_version=$(printf '%s\n%s\n' "$current_version" "$latest_version" | sort -V | tail -1)
          if [[ "$newest_version" != "$latest_version" ]]; then
            echo "The upstream latest release is older than appVersion; refusing a downgrade"
            echo "update=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current_major=${current_version%%.*}
          latest_major=${latest_version%%.*}
          if [[ "$current_major" != "$latest_major" ]]; then
            echo "Paperless-ngx ${latest_version} is a major update."
            echo "Major updates require a dedicated, manually prepared migration pull request."
            echo "update=false" >>"$GITHUB_OUTPUT"
            echo "major_update_available=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          registry_token=$(curl --fail --silent --show-error --location --retry 3 \
            'https://ghcr.io/token?scope=repository%3Apaperless-ngx%2Fpaperless-ngx%3Apull&service=ghcr.io' \
            | jq -r '.token // empty')
          if [[ -z "$registry_token" ]]; then
            echo "Unable to obtain a public GHCR pull token"
            exit 1
          fi

          manifest_headers=$(mktemp)
          curl --fail --silent --show-error --head --location --retry 3 \
            -H "Authorization: Bearer ${registry_token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null \
            --dump-header "$manifest_headers" \
            "https://ghcr.io/v2/paperless-ngx/paperless-ngx/manifests/${latest_version}"
          latest_digest=$(awk -F': ' '
            tolower($1) == "docker-content-digest" {
              gsub("\\r", "", $2)
              print $2
              exit
            }
          ' "$manifest_headers")
          rm -f "$manifest_headers"
          if ! [[ "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GHCR returned an invalid manifest digest: ${latest_digest:-missing}"
            exit 1
          fi

          if [[ "$current_version" == "$latest_version" && "$current_digest" == "$latest_digest" ]]; then
            echo "Already up to date"
            echo "update=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Once a reviewer starts working on an update, preserve that branch.
          # Recreating it every six hours can replace compatibility fixes and
          # repeatedly dispatch CI against an unchanged, already failing head.
          update_branch="chore/update-paperless-ngx-${latest_version}"
          existing_pr=$(gh pr list --state open --head "$update_branch" \
            --json number,url --jq '.[0].url // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "An update is already awaiting review: ${existing_pr}"
            echo "update=false" >>"$GITHUB_OUTPUT"
            printf 'Paperless-ngx %s is available. Continue the existing review: %s\n' \
              "$latest_version" "$existing_pr" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "update=true"
            echo "old_version=$current_version"
            echo "new_version=$latest_version"
            echo "old_digest=$current_digest"
            echo "new_digest=$latest_digest"
            echo "major_update=false"
            echo "release_url=https://github.com/paperless-ngx/paperless-ngx/releases/tag/${latest_tag}"
          } >>"$GITHUB_OUTPUT"

      - name: Update app and chart versions
        if: steps.check.outputs.update == 'true'
        env:
          MAJOR_UPDATE: ${{ steps.check.outputs.major_update }}
          NEW_IMAGE_DIGEST: ${{ steps.check.outputs.new_digest }}
          NEW_APP_VERSION: ${{ steps.check.outputs.new_version }}
          OLD_IMAGE_DIGEST: ${{ steps.check.outputs.old_digest }}
          OLD_APP_VERSION: ${{ steps.check.outputs.old_version }}
        run: |
          set -euo pipefail

          previous_security_status=$(awk '
            /^  artifacthub.io\/containsSecurityUpdates:/ {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' Chart.yaml)
          if [[ "$previous_security_status" != "true" && "$previous_security_status" != "false" ]]; then
            echo "Invalid Artifact Hub security update status: ${previous_security_status:-missing}"
            exit 1
          fi

          if [[ "$MAJOR_UPDATE" != "false" ]]; then
            echo "This workflow must never prepare a major application update"
            exit 1
          fi
          # Update only current package metadata. Historical migration findings
          # and cluster acceptance evidence need review, not version substitution.
          python3 .github/scripts/update-paperless-metadata.py \
            --version "$NEW_APP_VERSION" --digest "$NEW_IMAGE_DIGEST"
          new_chart_version=$(awk '/^version:/ { gsub(/"/, "", $2); print $2 }' Chart.yaml)

          scripts/generate-readme.sh

          grep -q "^version: \"${new_chart_version}\"$" Chart.yaml
          grep -q "^appVersion: \"${NEW_APP_VERSION}\"$" Chart.yaml
          grep -q "^  digest: \"${NEW_IMAGE_DIGEST}\"$" values.yaml
          grep -q "image: ghcr.io/paperless-ngx/paperless-ngx@${NEW_IMAGE_DIGEST}" Chart.yaml
          grep -q '^icon: https://raw.githubusercontent.com/paperless-ngx/paperless-ngx/main/docs/assets/logo_leaf.svg$' Chart.yaml
          grep -q '^  artifacthub.io/containsSecurityUpdates: "false"$' Chart.yaml
          if grep -q '^    - kind: security$' Chart.yaml; then
            echo "The previous release's Artifact Hub security change was not reset"
            exit 1
          fi

          {
            echo "NEW_CHART_VERSION=$new_chart_version"
            echo "NEW_APP_VERSION=$NEW_APP_VERSION"
            echo "OLD_APP_VERSION=$OLD_APP_VERSION"
            echo "NEW_IMAGE_DIGEST=$NEW_IMAGE_DIGEST"
            echo "OLD_IMAGE_DIGEST=$OLD_IMAGE_DIGEST"
            echo "PREVIOUS_SECURITY_STATUS=$previous_security_status"
          } >>"$GITHUB_ENV"

      - name: Create update pull request
        id: create-pull-request
        if: steps.check.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-paperless-ngx-${{ env.NEW_APP_VERSION }}
          delete-branch: true
          commit-message: "chore: update Paperless-ngx ${{ env.OLD_APP_VERSION }} -> ${{ env.NEW_APP_VERSION }}"
          title: "chore: update Paperless-ngx ${{ env.OLD_APP_VERSION }} -> ${{ env.NEW_APP_VERSION }}"
          body: |
            Automated update proposed from the latest stable upstream GitHub release.

            - Paperless-ngx: `${{ env.OLD_APP_VERSION }}` -> `${{ env.NEW_APP_VERSION }}`
            - Image digest: `${{ env.OLD_IMAGE_DIGEST }}` -> `${{ env.NEW_IMAGE_DIGEST }}`
            - Chart version: `${{ env.NEW_CHART_VERSION }}`
            - Major application update: `${{ steps.check.outputs.major_update }}`
            - Release notes: ${{ steps.check.outputs.release_url }}
            - Previous Artifact Hub security flag: `${{ env.PREVIOUS_SECURITY_STATUS }}`
            - New Artifact Hub security flag: reset to `false` pending this release review

            Review application compatibility, migrations, and release notes before merging.
            In particular, determine whether this Paperless release contains security fixes. If it
            does, set `artifacthub.io/containsSecurityUpdates` back to `true` and add a matching
            `kind: security` entry to `artifacthub.io/changes` before merging.
            `UPGRADE-0.4.md` and `TESTING.md` retain their previously reviewed facts and acceptance
            evidence. Update them for this target release after reviewing upstream changes and
            running the matching upgrade tests; do not replace historical version numbers globally.
            Remove version-scoped schema guards only after verifying their upstream fixes.
            The updater preserves an existing open PR and its human-authored compatibility fixes.
            Publishing remains handled by `release.yml` only after this PR is reviewed and merged.
          reviewers: CodeOpsMS

      - name: Verify update pull request was created
        if: steps.check.outputs.update == 'true'
        env:
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        run: |
          if [[ -z "$PR_NUMBER" || -z "$PR_URL" ]]; then
            echo "The update branch was created, but no pull request was returned."
            echo "Verify that GitHub Actions may create pull requests in repository settings."
            exit 1
          fi
          echo "Created pull request #${PR_NUMBER}: ${PR_URL}"

      # Pull requests created with GITHUB_TOKEN do not emit pull_request events.
      - name: Dispatch chart validation
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/update-paperless-ngx-${{ env.NEW_APP_VERSION }}
        run: gh workflow run helm-ci.yml --ref "$UPDATE_BRANCH"
