name: Helm CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-package:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.21.3
          - v4.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Configure chart repositories
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build dependencies
        run: helm dependency build .

      - name: Lint chart
        run: helm lint --strict .

      - name: Render chart
        run: >-
          helm template ci-render .
          --namespace paperless-ngx-ci
          >/tmp/paperless-ngx-rendered.yaml

      - name: Package chart
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          helm package . --destination "$package_dir"
          chart_name="$(helm show chart . | awk '/^name:/ { print $2 }')"
          chart_version="$(helm show chart . | awk '/^version:/ { print $2 }')"
          package="$package_dir/${chart_name}-${chart_version}.tgz"
          test -n "$chart_name"
          test -n "$chart_version"
          test -s "$package"
          helm show chart "$package" >/dev/null
          tar -tzf "$package" >"$package_dir/contents.txt"
          grep -qx 'paperless-ngx/LICENSE' "$package_dir/contents.txt"
          grep -qx 'paperless-ngx/NOTICE' "$package_dir/contents.txt"
          if grep -q '^paperless-ngx/.github/' "$package_dir/contents.txt"; then
            echo "The packaged chart must not contain GitHub workflow files"
            exit 1
          fi
