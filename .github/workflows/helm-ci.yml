name: Helm CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-package:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          # renovate: datasource=github-releases depName=helm-v3 packageName=helm/helm versioning=semver
          - v3.21.3
          # renovate: datasource=github-releases depName=helm-v4 packageName=helm/helm versioning=semver
          - v4.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check repository metadata
        run: bash .github/scripts/check-repository-metadata.sh .

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Configure chart repositories
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build dependencies
        run: helm dependency build .

      - name: Lint chart
        run: helm lint --strict .

      - name: Check chart icon
        run: bash .github/scripts/check-chart-icon.sh .

      - name: Render chart
        run: >-
          helm template ci-render .
          --namespace paperless-ngx-ci
          >/tmp/paperless-ngx-rendered.yaml

      - name: Verify internal dependency service discovery
        run: scripts/verify-internal-service-names.sh

      - name: Package chart
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          helm package . --destination "$package_dir"
          chart_name="$(helm show chart . | awk '/^name:/ { print $2 }')"
          chart_version="$(helm show chart . | awk '/^version:/ { print $2 }')"
          package="$package_dir/${chart_name}-${chart_version}.tgz"
          test -n "$chart_name"
          test -n "$chart_version"
          test -s "$package"
          helm show chart "$package" >/dev/null
          bash .github/scripts/check-chart-package.sh "$package"
