name: Helm CI

on:
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  renovate-readme:
    name: Regenerate README for Renovate
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate README with the trusted base-branch script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted_generator="${RUNNER_TEMP}/generate-readme.sh"
          git show "${BASE_SHA}:scripts/generate-readme.sh" >"$trusted_generator"
          chmod +x "$trusted_generator"
          ROOT_DIR="$GITHUB_WORKSPACE" "$trusted_generator"

      - name: Commit generated README when needed
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already current"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate README after dependency update"
          git push origin "HEAD:${HEAD_REF}"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push does not emit another pull_request event. Dispatch
      # validation explicitly so required checks run against the new head SHA.
      - name: Dispatch validation for updated branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run helm-ci.yml --ref "$HEAD_REF"

  static:
    name: Static / Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          # renovate: datasource=github-releases depName=helm-v3 packageName=helm/helm versioning=semver
          - &helm3 v3.21.3
          # renovate: datasource=github-releases depName=helm-v4 packageName=helm/helm versioning=semver
          - &helm4 v4.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Configure chart repositories
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build dependencies
        run: |
          helm dependency build .
          scripts/verify-chart-dependencies.sh

      - name: Run chart-testing lint
        run: ct lint --charts .

      - name: Run direct strict lint
        run: helm lint --strict .

      - name: Install helm-unittest
        run: |
          plugin_args=(
            https://github.com/helm-unittest/helm-unittest
            --version v1.1.1
          )
          if [[ "${{ matrix.helm-version }}" == v4.* ]]; then
            plugin_args+=(--verify=false)
          fi
          helm plugin install "${plugin_args[@]}"

      - name: Run chart unit tests
        run: helm unittest --strict .

      - name: Check repository metadata and stable icon
        run: |
          bash .github/scripts/check-repository-metadata.sh .
          bash .github/scripts/check-chart-icon.sh .

      - name: Verify generated README is current
        if: >-
          startsWith(matrix.helm-version, 'v4.') &&
          (github.event_name != 'pull_request' || github.actor != 'renovate[bot]')
        run: |
          scripts/generate-readme.sh
          git diff --exit-code -- README.md

      - name: Render representative configurations
        run: |
          helm template ci-default . \
            --namespace paperless-ngx-ci \
            >/tmp/paperless-default.yaml
          helm template ci-external . \
            --namespace paperless-ngx-ci \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.existingSecret.name=database-secret \
            --set valkey.internal=false \
            --set-string config.redis.existingSecret.name=redis-secret \
            --set-string config.secretKey.existingSecret.name=paperless-secret \
            --set networkPolicy.enabled=true \
            --set-json 'networkPolicy.egress.database=[{"to":[{"ipBlock":{"cidr":"10.0.0.0/8"}}],"ports":[{"protocol":"TCP","port":5432},{"protocol":"TCP","port":6379}]}]' \
            --set autoscaling.enabled=true \
            --set-string resources.requests.cpu=100m \
            >/tmp/paperless-external.yaml

      - name: Verify internal dependency service discovery
        run: scripts/verify-internal-service-names.sh

      - name: Verify database topologies and reject invalid values
        run: |
          helm template valid-sqlite . \
            --set config.database.engine=sqlite \
            --set postgresql.enabled=false \
            >/tmp/valid-sqlite.yaml
          helm template valid-mariadb . \
            --set config.database.engine=mariadb \
            --set postgresql.enabled=false \
            --set-string config.database.host=mariadb.example.invalid \
            --set-string config.database.existingSecret.name=mariadb-secret \
            >/tmp/valid-mariadb.yaml
          helm template valid-external-postgresql . \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.password=temporary-ci-password \
            >/tmp/valid-external-postgresql.yaml
          helm template valid-default-storage . \
            --set-string global.defaultStorageClass=ci-default \
            >/tmp/valid-default-storage.yaml
          helm template valid-legacy-storage . \
            --set-string global.storageClass=ci-legacy \
            >/tmp/valid-legacy-storage.yaml
          helm template valid-global-pull-secrets . \
            --set-json 'global.imagePullSecrets=["registry-secret"]' \
            >/tmp/valid-global-pull-secrets.yaml
          helm template valid-hpa-cpu . \
            --set autoscaling.enabled=true \
            --set-string resources.requests.cpu=100m \
            >/tmp/valid-hpa-cpu.yaml
          helm template valid-hpa-memory . \
            --set autoscaling.enabled=true \
            --set autoscaling.targetCPUUtilizationPercentage=null \
            --set autoscaling.targetMemoryUtilizationPercentage=70 \
            --set-string resources.requests.memory=128Mi \
            >/tmp/valid-hpa-memory.yaml
          helm template valid-hpa-default-cpu . \
            --set autoscaling.enabled=true \
            --set autoscaling.targetCPUUtilizationPercentage=null \
            --set autoscaling.targetMemoryUtilizationPercentage=null \
            --set-string resources.requests.cpu=100m \
            >/tmp/valid-hpa-default-cpu.yaml
          revision_zero=$(helm template revision-zero . | awk '$1 == "\"checksum/postgresql\":" { print $2; exit }')
          revision_one=$(helm template revision-one . \
            --set postgresql.credentialsRevision=1 \
            | awk '$1 == "\"checksum/postgresql\":" { print $2; exit }')
          secret_revision=$(helm template secret-revision . \
            --set config.secretRevision=7 \
            | awk '$1 == "\"paperless-ngx.codeopsms.de/secret-revision\":" { print $2; exit }')
          test -n "$revision_zero"
          test -n "$revision_one"
          test "$revision_zero" != "$revision_one"
          test "$secret_revision" = '"7"'
          helm template secret-oracle . \
            --show-only templates/deployment.yaml \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.password=alpha \
            --set valkey.internal=false \
            --set-string config.redis.url=redis://:alpha@redis.example.invalid:6379/0 \
            --set-string env.PAPERLESS_EMAIL_HOST_PASSWORD=alpha \
            >/tmp/secret-oracle-alpha.yaml
          helm template secret-oracle . \
            --show-only templates/deployment.yaml \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.password=beta \
            --set valkey.internal=false \
            --set-string config.redis.url=redis://:beta@redis.example.invalid:6379/0 \
            --set-string env.PAPERLESS_EMAIL_HOST_PASSWORD=beta \
            >/tmp/secret-oracle-beta.yaml
          cmp /tmp/secret-oracle-alpha.yaml /tmp/secret-oracle-beta.yaml
          if helm template no-secret-hashes . --show-only templates/deployment.yaml \
            | grep -Eq 'checksum/(config|env)'; then
            echo "Deployment annotations must not contain hashes derived from Secret values"
            exit 1
          fi
          grep -q 'storageClassName: ci-default' /tmp/valid-default-storage.yaml
          grep -q 'storageClassName: ci-legacy' /tmp/valid-legacy-storage.yaml
          grep -q 'name: registry-secret' /tmp/valid-global-pull-secrets.yaml
          if grep -q 'PAPERLESS_DBPORT' /tmp/valid-mariadb.yaml; then
            echo "MariaDB must use Paperless' engine-specific default port unless explicitly configured"
            exit 1
          fi

          expect_failure() {
            if "$@" >/tmp/expected-failure.log 2>&1; then
              echo "Expected command to fail: $*"
              exit 1
            fi
          }
          expect_failure helm template invalid . --set config.database.pass=legacy
          expect_failure helm template invalid . --set config.database.sslmode=require
          expect_failure helm template invalid . --set env.PAPERLESS_CONSUMER_POLLING=10
          expect_failure helm template invalid . --set env.PAPERLESS_CONSUMER_INOTIFY_DELAY=5
          expect_failure helm template invalid . --set env.PAPERLESS_CONSUMER_POLLING_DELAY=5
          expect_failure helm template invalid . --set env.PAPERLESS_CONSUMER_BARCODE_SCANNER=ZXING
          expect_failure helm template invalid . --set env.PAPERLESS_OCR_MODE=skip
          expect_failure helm template invalid . --set image.digest=invalid
          expect_failure helm template invalid . --set tests.image.digest=invalid
          expect_failure helm template invalid . \
            --set-string 'podLabels.app\.kubernetes\.io/component=worker'
          expect_failure helm template invalid . \
            --set-string 'podAnnotations.paperless-ngx\.codeopsms\.de/secret-revision=999'
          expect_failure helm template invalid . \
            --set-string 'postgresql.commonLabels.app\.kubernetes\.io/name=database'
          expect_failure helm template invalid . \
            --set-string 'postgresql.primary.podLabels.app\.kubernetes\.io/name=database'
          expect_failure helm template invalid . \
            --set-string 'valkey.commonLabels.app\.kubernetes\.io/name=broker'
          expect_failure helm template invalid . \
            --set-string 'valkey.podLabels.app\.kubernetes\.io/name=broker'
          expect_failure helm template invalid . --set valkey.service.port=6380
          expect_failure helm template invalid . --set-string postgresql.namespaceOverride=other-namespace
          expect_failure helm template invalid . --set valkey.auth.enabled=true
          expect_failure helm template invalid . --set valkey.tls.enabled=true
          expect_failure helm template invalid . \
            --set-string postgresql.auth.existingSecret=postgresql-credentials \
            --set-string postgresql.auth.secretKeys.userPasswordKey=
          expect_failure helm template invalid . \
            --set-string postgresql.auth.existingSecret=postgresql-credentials \
            --set-string postgresql.auth.secretKeys.adminPasswordKey=
          expect_failure helm template invalid . \
            --set-string postgresql.auth.existingSecret=postgresql-credentials \
            --set postgresql.architecture=replication \
            --set-string postgresql.auth.secretKeys.replicationPasswordKey=
          expect_failure helm template invalid . --set autoscaling.enabled=true
          expect_failure helm template invalid . \
            --set autoscaling.enabled=true \
            --set autoscaling.targetCPUUtilizationPercentage=null \
            --set autoscaling.targetMemoryUtilizationPercentage=null
          expect_failure helm template invalid . \
            --set autoscaling.enabled=true \
            --set autoscaling.targetCPUUtilizationPercentage=null \
            --set autoscaling.targetMemoryUtilizationPercentage=70
          expect_failure helm template invalid . --set postgresql.credentialsRevision=-1
          expect_failure helm template invalid . --set config.secretRevision=-1
          expect_failure helm template invalid . \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=5 \
            --set autoscaling.maxReplicas=2 \
            --set-string resources.requests.cpu=100m
          expect_failure helm template invalid . \
            --set-string config.database.host=postgres.example.invalid
          expect_failure helm template invalid . \
            --set-string config.database.password=ambiguous-password
          expect_failure helm template invalid . \
            --set-string config.database.existingSecret.name=ambiguous-secret
          expect_failure helm template invalid . \
            --set-string config.database.name=other-database
          expect_failure helm template invalid . \
            --set-string config.database.user=other-user
          expect_failure helm template invalid . \
            --set config.database.port=6543
          expect_failure helm template invalid . --set valkey.internal=false
          expect_failure helm template invalid . --set postgresql.enabled=false
          expect_failure helm template invalid . --set config.database.engine=sqlite
          expect_failure helm template invalid . --set config.database.engine=mariadb
          expect_failure helm template invalid . \
            --set config.database.engine=mariadb \
            --set postgresql.enabled=false
          expect_failure helm template invalid . \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid
          expect_failure helm template invalid . \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.password=ambiguous-password \
            --set-string config.database.existingSecret.name=ambiguous-secret
          expect_failure helm template invalid . \
            --set networkPolicy.enabled=true \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.existingSecret.name=database-secret

      - name: Verify image digests against registries
        if: startsWith(matrix.helm-version, 'v4.')
        run: scripts/verify-image-digests.sh

  candidate:
    name: Build immutable candidate
    runs-on: ubuntu-latest
    needs: static

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: *helm4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Keep canonical gzip/tar output stable across future runner updates.
          python-version: "3.14.6"

      - name: Build verified dependencies
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build .
          scripts/verify-chart-dependencies.sh

      - name: Test deterministic package normalizer
        run: python3 scripts/test-normalize-chart-package.py

      - name: Package and inspect chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p .candidate
          reproducibility_dir=$(mktemp -d)
          trap 'rm -rf "$reproducibility_dir"' EXIT

          helm package . --destination .candidate
          chart_version=$(helm show chart . | awk '/^version:/ { print $2 }')
          package=".candidate/paperless-ngx-${chart_version}.tgz"
          test -s "$package"
          scripts/normalize-chart-package.py "$package"

          helm package . --destination "$reproducibility_dir"
          reproducibility_package="${reproducibility_dir}/paperless-ngx-${chart_version}.tgz"
          scripts/normalize-chart-package.py "$reproducibility_package"
          cmp "$package" "$reproducibility_package"
          scripts/normalize-chart-package.py --check "$package"

          bash .github/scripts/check-chart-package.sh "$package"
          bash .github/scripts/check-chart-icon.sh "$package"
          package_sha=$(sha256sum "$package" | awk '{ print $1 }')
          echo "Candidate SHA-256: ${package_sha}"
          echo "version=$chart_version" >>"$GITHUB_OUTPUT"
          echo "path=$package" >>"$GITHUB_OUTPUT"
          echo "sha256=$package_sha" >>"$GITHUB_OUTPUT"

      - name: Upload candidate chart
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paperless-ngx-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          # The exact file lives below the intentionally hidden .candidate dir.
          include-hidden-files: true
          retention-days: 14

  representative-install:
    name: Required install / Helm 4 / Kubernetes 1.36
    runs-on: ubuntu-latest
    needs: candidate

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: *helm4

      - name: Resolve immutable candidate artifact
        id: candidate-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .github/scripts/resolve-candidate-artifact.sh
          "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate-artifact.outputs.id }}
          path: .candidate

      - name: Resolve immutable candidate
        id: candidate
        run: |
          set -euo pipefail
          packages=(.candidate/paperless-ngx-*.tgz)
          if [[ "${#packages[@]}" -ne 1 || ! -s "${packages[0]}" ]]; then
            echo "::error::Expected exactly one candidate chart package"
            exit 1
          fi
          bash .github/scripts/check-chart-package.sh "${packages[0]}"
          echo "Candidate SHA-256: $(sha256sum "${packages[0]}" | awk '{ print $1 }')"
          echo "path=${packages[0]}" >>"$GITHUB_OUTPUT"

      - name: Create Kubernetes 1.36 cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: &kind-version v0.32.0
          node_image: &kind136 kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          wait: 120s

      - name: Validate rendered resources against Kubernetes API
        run: |
          helm template representative "${{ steps.candidate.outputs.path }}" \
            --namespace paperless-api-validation \
            --set postgresql.enabled=false \
            --set-string config.database.host=postgres.example.invalid \
            --set-string config.database.existingSecret.name=database-secret \
            --set valkey.internal=false \
            --set-string config.redis.url=redis://valkey.example.invalid:6379/0 \
            >/tmp/paperless-representative.yaml
          kubectl create namespace paperless-api-validation
          kubectl apply --namespace paperless-api-validation \
            --dry-run=server -f /tmp/paperless-representative.yaml
          kubectl delete namespace paperless-api-validation --wait=true --timeout=5m

      - name: Run fresh-install E2E
        env:
          NAMESPACE: paperless-representative
          RELEASE: paperless-representative
          CLEANUP_NAMESPACE: "false"
          CANDIDATE_CHART: ${{ steps.candidate.outputs.path }}
        run: scripts/paperless-e2e.sh fresh "$CANDIDATE_CHART"

  full-fresh-matrix:
    name: Full install / Helm ${{ matrix.helm-version }} / Kubernetes ${{ matrix.kubernetes }}
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'chore/update-paperless-ngx-')
    runs-on: ubuntu-latest
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm-version: *helm3
            kubernetes: "1.34"
            node_image: &kind134 kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - helm-version: *helm3
            kubernetes: "1.35"
            node_image: &kind135 kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - helm-version: *helm3
            kubernetes: "1.36"
            node_image: *kind136
          - helm-version: *helm4
            kubernetes: "1.34"
            node_image: *kind134
          - helm-version: *helm4
            kubernetes: "1.35"
            node_image: *kind135
          - helm-version: *helm4
            kubernetes: "1.36"
            node_image: *kind136

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Resolve immutable candidate artifact
        id: candidate-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .github/scripts/resolve-candidate-artifact.sh
          "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate-artifact.outputs.id }}
          path: .candidate

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: *kind-version
          node_image: ${{ matrix.node_image }}
          wait: 120s

      - name: Install immutable candidate
        env:
          NAMESPACE: paperless-fresh
          RELEASE: paperless-fresh
        run: |
          set -euo pipefail
          packages=(.candidate/paperless-ngx-*.tgz)
          if [[ "${#packages[@]}" -ne 1 || ! -s "${packages[0]}" ]]; then
            echo "::error::Expected exactly one candidate chart package"
            exit 1
          fi
          package=${packages[0]}
          echo "Candidate SHA-256: $(sha256sum "$package" | awk '{ print $1 }')"
          scripts/paperless-e2e.sh fresh "$package"

  full-upgrade-matrix:
    name: Upgrade / ${{ matrix.name }} / Kubernetes ${{ matrix.kubernetes }}
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'chore/update-paperless-ngx-')
    runs-on: ubuntu-latest
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Helm 3 to Helm 3
            base_helm: *helm3
            upgrade_helm: *helm3
            kubernetes: "1.34"
            node_image: *kind134
          - name: Helm 3 to Helm 4
            base_helm: *helm3
            upgrade_helm: *helm4
            kubernetes: "1.35"
            node_image: *kind135
          - name: Helm 4 to Helm 4
            base_helm: *helm4
            upgrade_helm: *helm4
            kubernetes: "1.36"
            node_image: *kind136

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up baseline Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.base_helm }}

      - name: Preserve baseline Helm binary
        run: cp "$(command -v helm)" /tmp/helm-base

      - name: Set up upgrade Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.upgrade_helm }}

      - name: Resolve immutable candidate artifact
        id: candidate-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .github/scripts/resolve-candidate-artifact.sh
          "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate-artifact.outputs.id }}
          path: .candidate

      - name: Preserve upgrade Helm binary
        run: cp "$(command -v helm)" /tmp/helm-upgrade

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: *kind-version
          node_image: ${{ matrix.node_image }}
          wait: 120s

      - name: Download verified 0.3.23 baseline and resolve candidate
        id: candidate
        run: |
          set -euo pipefail

          baseline_version=0.3.23
          baseline_sha=6202d81c112d3e810d9abb37e16d5aa141a7b6a4e85911d4ff0c257f275beb22
          baseline_package=".candidate/paperless-ngx-${baseline_version}.tgz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            --output "$baseline_package" \
            "https://github.com/CodeOpsMS/paperless-ngx-helm-chart/releases/download/paperless-ngx-${baseline_version}/paperless-ngx-${baseline_version}.tgz"
          actual_baseline_sha=$(sha256sum "$baseline_package" | awk '{ print $1 }')
          if [[ "$actual_baseline_sha" != "$baseline_sha" ]]; then
            echo "::error::Baseline package SHA-256 mismatch: expected=${baseline_sha}, actual=${actual_baseline_sha}"
            exit 1
          fi
          test "$(helm show chart "$baseline_package" | awk '/^version:/ { print $2; exit }')" = "$baseline_version"
          test "$(helm show chart "$baseline_package" | awk '/^appVersion:/ { gsub(/"/, "", $2); print $2; exit }')" = "2.20.15"

          candidate_packages=(.candidate/paperless-ngx-*.tgz)
          if [[ "${#candidate_packages[@]}" -ne 2 ]]; then
            echo "::error::Expected the baseline and exactly one candidate package"
            exit 1
          fi
          candidate_package=
          for package in "${candidate_packages[@]}"; do
            if [[ "$package" != "$baseline_package" ]]; then
              candidate_package=$package
            fi
          done
          test -s "$baseline_package"
          test -s "$candidate_package"
          test "$(helm show chart "$candidate_package" | awk '/^version:/ { print $2; exit }')" != "$baseline_version"
          echo "Candidate SHA-256: $(sha256sum "$candidate_package" | awk '{ print $1 }')"
          echo "path=$candidate_package" >>"$GITHUB_OUTPUT"

      - name: Run Paperless 2 to 3 upgrade E2E
        env:
          BASE_CHART_PACKAGE: .candidate/paperless-ngx-0.3.23.tgz
          BASE_HELM_BIN: /tmp/helm-base
          HELM_BIN: /tmp/helm-upgrade
          NAMESPACE: paperless-upgrade
          RELEASE: paperless-upgrade
          CANDIDATE_CHART: ${{ steps.candidate.outputs.path }}
        run: scripts/paperless-e2e.sh upgrade "$CANDIDATE_CHART"
