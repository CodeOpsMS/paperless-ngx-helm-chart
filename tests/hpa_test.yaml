suite: Paperless horizontal pod autoscaler
templates:
  - templates/hpa.yaml
tests:
  - it: does not render when autoscaling is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the configured CPU target
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 5
      autoscaling.targetCPUUtilizationPercentage: 75
      resources.requests.cpu: 100m
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 75

  - it: omits metrics so Kubernetes can apply its default when both targets are empty
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: null
      autoscaling.targetMemoryUtilizationPercentage: null
      resources.requests.cpu: 100m
    asserts:
      - notExists:
          path: spec.metrics

  - it: renders a memory-only target with a matching memory request
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: null
      autoscaling.targetMemoryUtilizationPercentage: 70
      resources.requests.memory: 128Mi
    asserts:
      - equal:
          path: spec.metrics[0].resource.name
          value: memory
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70

  - it: rejects a minimum replica count above the maximum
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 5
      autoscaling.maxReplicas: 2
      resources.requests.cpu: 100m
    asserts:
      - failedTemplate:
          errorMessage: autoscaling.maxReplicas must be greater than or equal to autoscaling.minReplicas
