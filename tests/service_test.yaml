suite: Paperless service
templates:
  - templates/service.yaml
tests:
  - it: selects only the Paperless web component
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: web

  - it: exposes the Flower metrics port when enabled
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9100
            protocol: TCP
            targetPort: metrics

  - it: omits the metrics port when Flower is disabled
    set:
      env.PAPERLESS_ENABLE_FLOWER: false
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].name
          value: http
