suite: Helm connectivity test
templates:
  - templates/tests/test-connection.yaml
tests:
  - it: uses a pinned image and the restricted security profile
    asserts:
      - equal:
          path: spec.automountServiceAccountToken
          value: false
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: test
      - equal:
          path: spec.containers[0].image
          value: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: can disable the test hook
    set:
      tests.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: preserves the test suffix within the Kubernetes name limit
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-test-connection
