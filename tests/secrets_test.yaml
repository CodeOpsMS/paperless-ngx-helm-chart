suite: Paperless configuration secret
templates:
  - templates/secrets.yaml
tests:
  - it: emits Paperless 3 database options and a generated secret key
    asserts:
      - equal:
          path: data.PAPERLESS_DBENGINE
          value: cG9zdGdyZXNxbA==
      - equal:
          path: data.PAPERLESS_DB_OPTIONS
          value: c3NsbW9kZT1wcmVmZXI=
      - exists:
          path: data.PAPERLESS_SECRET_KEY
      - notExists:
          path: data.PAPERLESS_DBSSLMODE

  - it: targets the actual internal dependency services
    release:
      name: paperless-fresh
    asserts:
      - equal:
          path: data.PAPERLESS_DBHOST
          value: cGFwZXJsZXNzLWZyZXNoLXBvc3RncmVzcWw=
      - equal:
          path: data.PAPERLESS_REDIS
          value: cmVkaXM6Ly9wYXBlcmxlc3MtZnJlc2gtdmFsa2V5OjYzNzkvMA==

  - it: follows dependency fullname overrides
    release:
      name: paperless-fresh
    set:
      postgresql.fullnameOverride: paperless-database
      valkey.fullnameOverride: paperless-broker
    asserts:
      - equal:
          path: data.PAPERLESS_DBHOST
          value: cGFwZXJsZXNzLWRhdGFiYXNl
      - equal:
          path: data.PAPERLESS_REDIS
          value: cmVkaXM6Ly9wYXBlcmxlc3MtYnJva2VyOjYzNzkvMA==

  - it: follows dependency name overrides and PostgreSQL replication naming
    release:
      name: paperless-fresh
    set:
      postgresql.nameOverride: database
      postgresql.architecture: replication
      postgresql.primary.name: leader
      valkey.nameOverride: broker
    asserts:
      - equal:
          path: data.PAPERLESS_DBHOST
          value: cGFwZXJsZXNzLWZyZXNoLWRhdGFiYXNlLWxlYWRlcg==
      - equal:
          path: data.PAPERLESS_REDIS
          value: cmVkaXM6Ly9wYXBlcmxlc3MtZnJlc2gtYnJva2VyOjYzNzkvMA==

  - it: preserves dependency discovery with a maximum-length release name
    release:
      name: paperless-production-eu-west-upgrade-validation-1234
    asserts:
      - equal:
          path: data.PAPERLESS_DBHOST
          value: cGFwZXJsZXNzLXByb2R1Y3Rpb24tZXUtd2VzdC11cGdyYWRlLXZhbGlkYXRpb24tMTIzNC1wb3N0Z3Jlc3Fs
      - equal:
          path: data.PAPERLESS_REDIS
          value: cmVkaXM6Ly9wYXBlcmxlc3MtcHJvZHVjdGlvbi1ldS13ZXN0LXVwZ3JhZGUtdmFsaWRhdGlvbi0xMjM0LXZhbGtleTo2Mzc5LzA=

  - it: omits values sourced from external secrets
    set:
      config.secretKey.existingSecret.name: paperless-secret
      config.database.existingSecret.name: database-secret
      valkey.internal: false
      postgresql.enabled: false
      config.database.host: postgres.example
      config.redis.existingSecret.name: redis-secret
    asserts:
      - notExists:
          path: data.PAPERLESS_SECRET_KEY
      - notExists:
          path: data.PAPERLESS_DBPASS
      - notExists:
          path: data.PAPERLESS_REDIS

  - it: renders scalar extra environment settings into the Secret
    set:
      env:
        PAPERLESS_TIME_ZONE: Europe/Berlin
        PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
    asserts:
      - equal:
          path: data.PAPERLESS_TIME_ZONE
          value: RXVyb3BlL0Jlcmxpbg==
      - equal:
          path: data.PAPERLESS_CONSUMER_DELETE_DUPLICATES
          value: dHJ1ZQ==

  - it: renders the configured Redis key prefix
    set:
      config.redis.prefix: paperless-e2e
    asserts:
      - equal:
          path: data.PAPERLESS_REDIS_PREFIX
          value: cGFwZXJsZXNzLWUyZQ==
