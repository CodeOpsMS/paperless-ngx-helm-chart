global:
  image:
    # -- if set it will overwrite all registry entries
    registry:
    # -- if set it will overwrite all pullPolicy
    pullPolicy:

# -- This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- replicas
replicaCount: 1

image:
  # -- image registry (could be overwritten by global.image.registry)
  registry: "ghcr.io"
  # -- image repository
  repository: paperless-ngx/paperless-ngx
  # -- This sets the pull policy for images. (could be overwritten by global.image.pullPolicy)
  pullPolicy: IfNotPresent
  # -- image tag - Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # -- Immutable multi-platform image digest. When set, it overrides the tag.
  digest: "sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b"


serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- This is for setting Kubernetes Labels to a Deployment.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
deploymentLabels: {}

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

strategy:
  # -- Deployment strategy. RollingUpdate preserves the existing scaling behavior.
  type: RollingUpdate

# -- Grace period for Paperless workers to stop cleanly.
terminationGracePeriodSeconds: 60

config:
  # -- Public Paperless URL. Empty derives the URL from the first ingress host.
  url: ""
  # -- Additional Django applications.
  apps: ""
  secretKey:
    existingSecret:
      # -- Existing Secret containing PAPERLESS_SECRET_KEY. Empty uses a generated, upgrade-stable key.
      name: ""
      # -- Key in the existing Secret.
      key: "PAPERLESS_SECRET_KEY"
  redis:
    # -- External Redis-compatible broker URL when valkey.internal is false.
    url: ""
    prefix: ""
    existingSecret:
      # -- Existing Secret containing the external broker URL.
      name: ""
      # -- Key in the existing Secret.
      urlKey: "url"
  database:
    engine: "postgresql"
    host: ""
    port: 5432
    name: "paperless"
    user: "paperless"
    # -- Database password. Ignored when config.database.existingSecret.name is set.
    password: "paperless"
    existingSecret:
      # -- Existing Secret containing the database password.
      name: ""
      # -- Key in the existing Secret.
      passwordKey: "password"
    # -- Paperless 3 database options, for example sslmode=require,pool.max_size=5.
    options: "sslmode=prefer"
  # -- django-allauth provider configuration serialized as JSON.
  oidcProviders: null

env:
  # -- correct ip-address by X-Forwarded-For (example value for env)
  PAPERLESS_USE_X_FORWARD_HOST: true
  # -- start service for monitor background jobs e.g. for prometheus (example value for env)
  PAPERLESS_ENABLE_FLOWER: true
  # -- Example using a Kubernetes EnvVar source.
  # PAPERLESS_TEST:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "secret"
  #       key: "key"

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # -- This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Paperless 3 may need substantial time for database migrations and the first
# Tantivy index build. The startup probe permits 30 minutes before liveness starts.
livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
startupProbe:
  enabled: true
  path: /
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 180

networkPolicy:
  # -- deploy networkpolicy
  # @section -- NetworkPolicy
  enabled: false
  ingress:
    # -- allow to http ports
    # should be your ingress-controller
    # @section -- NetworkPolicy
    http: []
    # -- ingress for metrics port (e.g. prometheus)
    # @section -- NetworkPolicy
    metrics: []
  egress:
    # -- activate egress no networkpolicy
    # @section -- NetworkPolicy
    enabled: true
    # -- rule to access DNS
    # @section -- NetworkPolicy
    dns:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # -- Rules for external PostgreSQL/Redis-compatible services. Required when an internal dependency is disabled.
    # @section -- NetworkPolicy
    database: []
    # -- allow additinal  egress (e.g. smtp, imap)
    # @section -- NetworkPolicy
    extra: []

persistence:
  enabled: true
  # -- Retain chart-managed Paperless data when the Helm release is uninstalled.
  retain: true
  annotations: {}
  # -- Persistent Volume Storage Class
  # If defined, storageClassName: <storageClass>
  # If set to "-", storageClassName: "", which disables dynamic provisioning
  # If undefined (the default) or set to null, no storageClassName spec is
  #   set, choosing the default provisioner.  (gp2 on AWS, standard on
  #   GKE, AWS & OpenStack)
  #
  storageClass:

  # -- A manually managed Persistent Volume and Claim
  # Requires persistence.enabled: true
  # If defined, PVC must be created manually before volume will be bound
  existingClaim:

  # -- Do not create an PVC, direct use hostPath in Pod
  hostPath:
  accessMode: ReadWriteOnce
  size: 5Gi

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

tests:
  # -- Enable the Helm connectivity test pod.
  enabled: true
  image:
    repository: busybox
    tag: "1.38.0"
    digest: "sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi


prometheus:
  servicemonitor:
    # -- broken, Host need to be localhost on request (instatt of ip)
    # needs: https://github.com/prometheus-operator/prometheus-operator/pull/7003
    enabled: false
    labels: {}
    # -- interval
    interval:
    # -- scrape timeout
    scrapeTimeout:
  rules:
    enabled: false
    labels: {}
    # current no default alertrules are provided
    additionalRules: []

grafana:
  dashboards:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    digest: "sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d"
  auth:
    database: paperless
    username: paperless
    password: paperless
    postgresPassword: supersecureadminpassword

valkey:
  internal: true
  # -- Database ID for non-default database
  dbid: 0

  service:
    port: 6379

  image:
    tag: "9.0.2@sha256:930b41430fb727f533c5982fe509b6f04233e26d0f7354e04de4b0d5c706e44e"

  dataStorage:
    className: ""
    keepPvc: true
